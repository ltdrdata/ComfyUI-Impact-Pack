[pytest]
# Keep collection below the extension's server-initializing __init__.py.
pythonpath = .. ../modules
required_plugins = pytest-timeout
addopts = --strict-markers
testpaths =
    wildcards/test_config.py
    wildcards/test_populate_regression.py
    wildcards/test_seed_regression.py
    wildcards/test_wildcard_encoding_strict.py
    wildcards/test_lora_wildcard_source.py
